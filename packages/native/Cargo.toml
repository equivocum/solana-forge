[package]
name = "solana-learn-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
solana-poh = "2"
solana-runtime = "2"
solana-ledger = "2"
solana-vote-program = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
